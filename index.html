<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Ghost 3D Game - God Mode</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #hud h1 { margin: 0 0 5px 0; font-size: 24px; color: #ff758c; }
        #hud p { margin: 2px 0; font-size: 16px; }

        /* God Mode Panel */
        #god-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 30, 0.85);
            border: 2px solid #ff758c;
            border-radius: 12px;
            padding: 15px 20px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            min-width: 220px;
        }
        #god-panel h3 {
            margin: 0 0 10px 0;
            color: #ff758c;
            border-bottom: 1px solid rgba(255,117,140,0.3);
            padding-bottom: 5px;
            font-size: 18px;
            text-align: center;
        }
        .cheat-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
            cursor: pointer;
            font-size: 14px;
        }
        .cheat-option input {
            accent-color: #ff758c;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        #toggle-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #ff758c;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(255,117,140,0.4);
            pointer-events: none;
            z-index: 10;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            z-index: 1000;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="loading">Loading 3D World... 👻</div>
    <div id="canvas-container"></div>

    <div id="hud">
        <h1>👻 Cute Ghost 3D</h1>
        <p>Score: <span id="score-val">0</span></p>
        <p>Status: <span id="status-val" style="color: #4cd137;">Normal</span></p>
    </div>

    <div id="toggle-hint">Press [ G ] to open God Mode Menu</div>

    <!-- God Mode Control Panel -->
    <div id="god-panel">
        <h3>⚡ GOD MODE MENU</h3>
        <label class="cheat-option">
            <span>🛡️ Invincibility</span>
            <input type="checkbox" id="cheat-god">
        </label>
        <label class="cheat-option">
            <span>🕊️ Fly Mode</span>
            <input type="checkbox" id="cheat-fly">
        </label>
        <label class="cheat-option">
            <span>🚀 Super Speed</span>
            <input type="checkbox" id="cheat-speed">
        </label>
        <label class="cheat-option">
            <span>💰 Score x100</span>
            <input type="checkbox" id="cheat-score">
        </label>
        <div style="margin-top: 12px; font-size: 11px; color: #aaa; text-align: center;">
            Sound Hotkeys: [1-5] Play SFX
        </div>
    </div>

    <!-- Include Three.js & GLTFLoader via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- AUDIO SYSTEM ---
        const sounds = {
            scare1: new Audio('scare1.mp3'),
            crying: new Audio('crying.mp3'),
            laugh: new Audio('laugh.mp3'),
            singing: new Audio('singing.mp3'),
            growl: new Audio('growl.mp3')
        };

        function playSound(name) {
            if (sounds[name]) {
                sounds[name].currentTime = 0;
                sounds[name].play().catch(e => console.log("Audio play blocked or missing:", e));
            }
        }

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b1a);
        scene.fog = new THREE.FogExp2(0x0b0b1a, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- LIGHTING (Prevent Black Screen) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff758c, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x70a1ff, 1.0);
        backLight.position.set(-5, -5, -5);
        scene.add(backLight);

        // --- LOAD 3D MODEL ---
        let ghostModel = null;
        const loader = new THREE.GLTFLoader();
        loader.load('scene.gltf', (gltf) => {
            ghostModel = gltf.scene;
            ghostModel.scale.set(1, 1, 1);
            ghostModel.position.set(0, 0, 0);
            scene.add(ghostModel);
            
            document.getElementById('loading').style.display = 'none';
        }, (xhr) => {
            console.log((xhr.loaded / xhr.total * 100) + '% loaded');
        }, (error) => {
            console.error('An error happened loading GLTF:', error);
            document.getElementById('loading').innerText = 'Error loading 3D Model! Check console.';
        });

        // --- GAME STATE & CHEAT ENGINE ---
        let score = 0;
        const cheats = {
            godMode: false,
            flyMode: false,
            superSpeed: false,
            scoreMultiplier: false
        };

        // UI Event Listeners
        document.getElementById('cheat-god').addEventListener('change', (e) => cheats.godMode = e.target.checked);
        document.getElementById('cheat-fly').addEventListener('change', (e) => cheats.flyMode = e.target.checked);
        document.getElementById('cheat-speed').addEventListener('change', (e) => cheats.superSpeed = e.target.checked);
        document.getElementById('cheat-score').addEventListener('change', (e) => cheats.scoreMultiplier = e.target.checked);

        // Hotkey [G] for God Mode Panel & Sound Triggers [1-5]
        window.addEventListener('keydown', (e) => {
            if (e.key === 'g' || e.key === 'G') {
                const panel = document.getElementById('god-panel');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            }
            if (e.key === '1') playSound('scare1');
            if (e.key === '2') playSound('crying');
            if (e.key === '3') playSound('laugh');
            if (e.key === '4') playSound('singing');
            if (e.key === '5') playSound('growl');
        });

        // --- ANIMATION LOOP ---
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();

            // Score increment logic with Multiplier cheat
            let addScore = cheats.scoreMultiplier ? 100 : 1;
            score += addScore;
            document.getElementById('score-val').innerText = score;

            // Status display update
            let activeCheats = [];
            if (cheats.godMode) activeCheats.push("God");
            if (cheats.flyMode) activeCheats.push("Fly");
            if (cheats.superSpeed) activeCheats.push("Speed");
            if (cheats.scoreMultiplier) activeCheats.push("x100");
            
            const statusVal = document.getElementById('status-val');
            if (activeCheats.length > 0) {
                statusVal.innerText = "CHEEATING (" + activeCheats.join(", ") + ")";
                statusVal.style.color = "#ff4757";
            } else {
                statusVal.innerText = "Normal";
                statusVal.style.color = "#4cd137";
            }

            // Gentle floating animation for the ghost model
            if (ghostModel) {
                let speedFactor = cheats.superSpeed ? 5.0 : 1.0;
                let hoverHeight = cheats.flyMode ? Math.sin(clock.getElapsedTime() * 3 * speedFactor) * 1.5 + 1.0 : Math.sin(clock.getElapsedTime() * 2) * 0.2;
                ghostModel.position.y = hoverHeight;
                ghostModel.rotation.y += 0.01 * speedFactor;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
